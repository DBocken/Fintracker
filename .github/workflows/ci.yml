name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Voller Verlauf: der i18n-Check diffed gegen origin/main (merge-base).
          # Bewusst voller Klon statt gezieltem Deepen — Repo ist mit ~7,5 MB
          # klein genug, dass das nicht ins Gewicht fällt. Bei spürbarem
          # Repo-Wachstum auf ein gezieltes Deepen (z. B. `fetch-depth: <n>` +
          # `git fetch --deepen` bei Bedarf) umstellen.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test-Struktur-Check
        run: pnpm check:test-structure

      - name: i18n-Check
        run: |
          git fetch origin main
          pnpm check:i18n --range origin/main...HEAD

      - name: i18n-Waechter (eingefrorene Uebersetzungen)
        run: pnpm check:i18n-module-consts

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests & Coverage
        run: pnpm test:coverage

      - name: Red-team regression suites
        run: |
          pnpm test:security
          pnpm test:integrity
          pnpm test:privacy
          pnpm test:mobile

      - name: Secret scan
        run: pnpm security:secrets
