name: CI

on:
  # `push` NUR auf main. Ohne Filter loest jeder Push auf einen PR-Branch ZWEI
  # vollstaendige Laeufe aus — einen fuer `push`, einen fuer `pull_request` —
  # mit identischem Ergebnis. Das ist die Haelfte der Warteschlange fuer nichts
  # und verzoegert genau die Laeufe, auf die es ankommt.
  #
  # Ein Branch ohne offenen Pull Request bekommt damit keinen Lauf mehr. Das ist
  # gewollt: Geprueft wird, was gemergt werden soll.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ueberholte Laeufe abbrechen, statt sie mitlaufen zu lassen. Ohne diese Gruppe
# bleibt fuer JEDEN Push eines Branches ein vollstaendiger Lauf in der
# Warteschlange stehen — auch fuer laengst ueberschriebene Commits. Bei einer
# Serie von Commits belegen die alten Laeufe dann die Runner-Kontingente und
# verzoegern genau den Lauf, auf den es ankommt: den aktuellen.
#
# `main` ist ausgenommen (`github.run_id` macht die Gruppe dort eindeutig):
# Auf dem Hauptbranch soll jeder Commit sein eigenes, vollstaendiges Ergebnis
# behalten — sonst faehrt ein schneller Folge-Commit den Nachweis fuer seinen
# Vorgaenger weg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Auf `main` NICHT abbrechen: dort soll jeder Commit sein eigenes,
  # vollstaendiges Ergebnis behalten. Auf Feature-Branches schon — sonst
  # bleibt fuer jeden Push ein ueberholter Lauf in der Warteschlange stehen und
  # verzoegert genau den, auf den es ankommt.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Voller Verlauf: der i18n-Check diffed gegen origin/main (merge-base).
          # Bewusst voller Klon statt gezieltem Deepen — Repo ist mit ~7,5 MB
          # klein genug, dass das nicht ins Gewicht fällt. Bei spürbarem
          # Repo-Wachstum auf ein gezieltes Deepen (z. B. `fetch-depth: <n>` +
          # `git fetch --deepen` bei Bedarf) umstellen.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test-Struktur-Check
        run: pnpm check:test-structure

      # TypeScript kennt keine Schichten: ein Import nach oben sieht aus wie
      # einer nach unten. So sind 30 umgedrehte Abhaengigkeiten entstanden,
      # ohne dass je etwas rot wurde.
      - name: Schicht-Waechter
        run: pnpm check:layers

      # Ratsche, kein Verbot: Solange eine Flaeche ihre eigene Datenschicht IST,
      # laesst sich keine zweite Praesentation danebenstellen, ohne die
      # Datenbeschaffung ein zweites Mal zu schreiben (AGENTS.md §4).
      - name: Ansicht/Daten-Waechter
        run: pnpm check:view-data

      # Zweite Ratsche neben Ansicht/Daten: zaehlt Importe aus
      # src/features/<slice>/presentation/ nach der Alt-Oberflaeche
      # (src/components/, src/pages/). ARCH-3: der Referenz-Slice `dashboard`
      # importiert TransactionCharts.tsx (564 Zeilen) aus components/ — eine
      # andere Fachfrage als Datenzugriffe, deshalb eine eigene Zahl statt
      # einer Erweiterung von check:view-data.
      - name: Slice-Presentation-Waechter
        run: pnpm check:slice-presentation

      # Ein type="number"-Feld verstuemmelt deutsche Dezimaleingaben, BEVOR
      # ein Parser sie sieht: "12,50" wird zu 1250, ein Zinssatz "5,5" zu 55 %.
      - name: Dezimal-Eingabe-Check
        run: pnpm check:decimal-inputs

      - name: Karten-Regel-Check
        run: pnpm check:card-rule

      - name: Plattform-Paritaets-Check
        run: pnpm check:platform-parity

      - name: Fehlerzustands-Check (useQuery)
        run: pnpm check:query-errors

      # Statisch, weil der axe-Durchlauf nur sieht, was gerade gerendert ist:
      # er fand acht namenlose Auswahlfelder, die Quelle enthielt 48. Der Rest
      # steckt in Dialogen und Sheets ohne Klickpfad.
      - name: Namens-Check (Bedienelemente)
        run: pnpm check:a11y-names

      # Die Zeilenabdeckung lag bei 71 % — und /debts zeigte nach einem
      # Lesefehler trotzdem „Noch keine Schulden". Eine Prozentzahl zaehlt
      # Zeilen, dieser Schritt zaehlt Aussagen je Flaeche und Zustand.
      - name: Zustands-Abdeckung je Flaeche
        run: pnpm check:state-coverage

      # #293 meldete EIN verlorenes Einstellungsfeld; nachgemessen stand
      # dieselbe Lesen-Aendern-Schreiben-Sequenz in 12 Dateien — dort verliert
      # sie eine Buchung, und zwar ohne Fehler und ohne Luecke, nach der jemand
      # sucht. Ohne Ausnahmeliste (Issue #311).
      - name: Serialisierung der Schreibpfade
        run: pnpm check:store-serialization

      # Der Sanfte Modus ist ein Barrierefreiheits-Versprechen: Wer ihn
      # einschaltet, will seine Zahlen nicht sehen. Ein einziger unmaskierter
      # Betrag auf derselben Flaeche hebt es auf (Issue #296).
      - name: Sanfter Modus (unmaskierte Betraege)
        run: pnpm check:money-format

      # „Eine Anbieterregel ohne Waechter ist eine Absichtserklaerung" (ADR
      # eu-souveraenitaet.md). Prueft beide Richtungen: jeder Host im
      # Produktivcode ist im Anbieter-Register erklaert, und jede aktive
      # Registerzeile kommt im Code oder in der CSP vor — ein Register, das
      # einen Anbieter fuehrt, den es nicht mehr gibt, ist die Faktenbasis
      # fuer VVT und Datenschutztext und damit schlimmer als keines.
      - name: EU-Regel (externe Endpunkte gegen das Anbieter-Register)
        run: pnpm check:external-endpoints

      - name: i18n-Check (Diff)
        run: |
          git fetch origin main
          pnpm check:i18n --range origin/main...HEAD

      # Der Diff-Modus sieht Altbestand strukturell NIE. Genau daran sind in
      # Phase 9 zweimal hartcodierte Strings vorbeigelaufen, bis jemand die
      # Datei aus anderem Grund anfasste. Der Bestandsmodus prueft den ganzen
      # Baum und ist seit WP-10.1 sauber — er darf es bleiben.
      - name: i18n-Check (Bestand)
        run: pnpm check:i18n --all

      - name: i18n-Waechter (eingefrorene Uebersetzungen)
        run: pnpm check:i18n-module-consts

      # Roh-`parseFloat` mit Komma-Ersetzung verstuemmelt einen deutschen
      # Geldbetrag ("1.200" -> 1,2); `as unknown as` hebelt TypeScript an
      # einer Datengrenze vollstaendig aus und prueft zur Laufzeit nichts
      # (GOV-1). i18n hatte drei Erkennungsformen, diese Regel bis WP 2.2 keine.
      - name: Geld-Parsing-Check
        run: pnpm check:money-parsing

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # GOV-2: `docs/coding-guide.md` behauptete seit Langem, `api/` und
      # `mcp-poc/` gehoerten in den Typecheck. Beides lief nie — das
      # Root-tsconfig includiert nur `src` + `vitest.setup.ts`, und
      # `mcp-poc/tsconfig.json` rief kein CI-Schritt auf. Ausgerechnet der
      # Token-Endpunkt kompilierte also ungeprueft.
      - name: Typecheck api/ (Serverless Functions)
        run: pnpm typecheck:api

      # Eigener Schritt mit eigenem Install: mcp-poc ist bewusst KEIN
      # Workspace-Paket (siehe pnpm-workspace.yaml, `packages: [.]`) und hat
      # eine eigene Lockdatei — dieselbe Trennung, die auch der OSV-Scan
      # respektiert. Ohne `--ignore-workspace` uebernimmt der Root-Workspace
      # den Aufruf und installiert nichts.
      - name: Typecheck mcp-poc (POC-Server)
        run: |
          pnpm --dir mcp-poc install --frozen-lockfile --ignore-workspace
          pnpm typecheck:mcp-poc

      # EntitlementService (WP 6.2) — dieselbe Trennung wie mcp-poc: kein
      # Workspace-Paket, eigene Lockdatei, eigener Install. Seine Tests laufen
      # in `node`, nicht in `jsdom`; die Wurzel-Suite schliesst `services/**`
      # deshalb aus (vitest.config.ts). Ohne diesen Schritt liefe der Dienst
      # in CI ueberhaupt nicht — genau die Luecke, die GOV-2 fuer api/ und
      # mcp-poc beschrieben hat.
      - name: Typecheck + Tests EntitlementService
        run: |
          pnpm --dir services/entitlements install --frozen-lockfile --ignore-workspace
          pnpm typecheck:entitlements
          pnpm test:entitlements

      # Bis WP-10.6 hatte CI ueberhaupt keinen Build-Schritt: Der
      # Produktions-Build lief nur nebenbei im Performance-Job
      # (E2E_TARGET=preview). Ein Build-Fehler waere dort als
      # Performance-Fehlschlag erschienen — an der falschen Stelle gesucht.
      - name: Produktions-Build
        run: pnpm build

      # Die Menge an JavaScript stand bisher nur als Warnung im Build-Protokoll.
      # Eine Warnung, die bei jedem Build erscheint, liest nach der dritten
      # Woche niemand mehr.
      - name: Bundle-Budget
        run: pnpm check:bundle-size

      - name: Tests & Coverage
        run: pnpm test:coverage

      - name: Red-team regression suites
        run: |
          pnpm test:security
          pnpm test:integrity
          pnpm test:privacy
          pnpm test:mobile

      - name: Secret scan
        run: pnpm security:secrets

  # Migrationen des EntitlementService gegen ein WEGWERF-Postgres (WP 6.2).
  #
  # Der Nachweis, der beim Supabase-Bestand fehlt: Dort zeigt das Dashboard
  # `No migrations`, waehrend das Repo 17 SQL-Dateien fuehrt und kein
  # CI-Schritt sie anwendet — es ist also unbekannt, welche Schritte
  # tatsaechlich im Schema stehen. Hier beweist jeder Lauf, dass ein LEERES
  # Postgres allein aus dem Repo auf den aktuellen Stand kommt.
  #
  # Eigener Job, weil er einen Datenbankdienst braucht; `needs:` fehlt
  # bewusst, damit er parallel zur schnellen Rueckmeldung laeuft.
  entitlements-migrations:
    name: EntitlementService — Migrationen gegen leeres Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entitlements
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: entitlements
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entitlements"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Abhaengigkeiten (eigener Install, kein Workspace-Member)
        run: pnpm --dir services/entitlements install --frozen-lockfile --ignore-workspace

      - name: Migrationen anwenden
        env:
          DATABASE_URL: postgres://entitlements:ci@localhost:5432/entitlements
        run: pnpm --dir services/entitlements migrate

      - name: Zweiter Lauf ist ein No-op (Idempotenz des Schemas)
        env:
          DATABASE_URL: postgres://entitlements:ci@localhost:5432/entitlements
        run: |
          AUSGABE=$(pnpm --dir services/entitlements migrate)
          echo "$AUSGABE"
          # Ein zweiter Lauf darf nichts mehr tun. Taete er es, waere die
          # Versionstabelle wirkungslos und jeder Deploy wuerde das Schema
          # erneut anfassen.
          echo "$AUSGABE" | grep -q "Schema ist aktuell"

      - name: Erwartete Tabellen sind da
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U entitlements -d entitlements -tAc \
            "SELECT string_agg(tablename, ',' ORDER BY tablename)
               FROM pg_tables WHERE schemaname='public'" | tee /tmp/tabellen
          grep -q "entitlements" /tmp/tabellen
          grep -q "processed_events" /tmp/tabellen
          grep -q "schema_migrations" /tmp/tabellen

  # E2E-Suite (WP-4.6-Slice). Bisher lief sie nur lokal — die im Gate
  # dokumentierten Nachweise waren damit nicht reproduzierbar.
  #
  # Bewusst ein EIGENER Job und nicht ein Schritt in `quality`: der Lauf
  # braucht einen Browser und einen Server, dauert um ein Vielfaches länger,
  # und ein Fehlschlag hier soll die schnelle Rückmeldung aus Lint/Typecheck/
  # Unit-Tests nicht verzögern. `needs:` fehlt aus demselben Grund — beide
  # Jobs laufen parallel.
  e2e:
    name: E2E (Slice, a11y, Visual, Performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Der Browser-Download ist der teuerste Einzelschritt des Jobs und
      # ändert sich nur mit der Playwright-Version — deshalb über sie
      # geschlüsselt und nicht über die Lockdatei.
      - name: Playwright-Version ermitteln
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Browser-Cache
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` nur beim Cache-Miss: die Systembibliotheken landen unter
      # /usr/lib und werden vom Cache oben nicht erfasst, sind auf dem
      # GitHub-Runner-Image aber ohnehin vorhanden.
      - name: Chromium installieren
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Funktional, Accessibility und Visual Regression gegen den Dev-Server.
      # Die eingecheckten Visual-Baselines sind linux-Baselines und damit
      # genau für diesen Runner erzeugt.
      - name: E2E gegen Dev-Server
        env:
          # Der Runner hat keine GPU; WebGL rendert in Software. Die
          # Warm-Navigation in die Finanzstadt ist damit nicht aussagekräftig
          # und wird als Test-Info statt als Fehlschlag berichtet — die
          # gemessene Zahl steht trotzdem im Bericht.
          E2E_SOFTWARE_WEBGL: "1"
        run: pnpm test:e2e

      # Zweiter Lauf gegen den Produktions-Build: NUR dort gilt das
      # LCP-Budget des Plans (< 2.5 s, Plan §5/§7). Der Dev-Lauf oben misst
      # gegen ein aufgeweichtes Budget, weil Vite on-the-fly transformiert.
      - name: Performance gegen Produktions-Build
        env:
          E2E_TARGET: preview
          E2E_SOFTWARE_WEBGL: "1"
        run: pnpm test:e2e vertical-slice-performance.spec.ts

      - name: Bericht bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
