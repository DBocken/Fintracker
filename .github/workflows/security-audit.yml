name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly

permissions:
  contents: read

# Gleiche Begruendung wie in ci.yml: ueberholte Laeufe belegen sonst die
# Warteschlange. Eigener Gruppen-Praefix, damit sich die beiden Workflows nicht
# gegenseitig abbrechen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Job-Key bewusst weiterhin "npm-audit": falls dieser Check in der
  # Branch-Protection als "required" hinterlegt ist, bliebe ein umbenannter Job
  # als nie gemeldeter Pflicht-Check hängen und würde den Merge blockieren.
  # Inhaltlich läuft hier jetzt OSV-Scanner statt `pnpm audit`.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Ersetzt das frühere `pnpm audit --audit-level=moderate`: npm hat den
      # Legacy-Audit-Endpoint (/-/npm/v1/security/audits), den `pnpm audit`
      # aufruft, dauerhaft abgeschaltet (HTTP 410) — der Schritt schlug bei
      # jedem Commit fehl, ohne echten Sicherheitsbefund. OSV-Scanner scannt
      # pnpm-lock.yaml direkt gegen die OSV-Advisory-DB und exit-codet != 0 bei
      # Funden (echtes Pass/Fail-Gate). Als Go-Tool per `go install` mit
      # VERSIONS-Pin bezogen (Go-Modul + Go-Checksum-DB = reproduzierbar); es
      # ist kein zu pinnender Action-Ref nötig (AGENTS.md §10.4 gilt für
      # `uses:` — hier bleibt nur das bereits SHA-gepinnte actions/checkout).
      # Go ist auf ubuntu-latest vorinstalliert; kein `pnpm install` mehr nötig,
      # da OSV die Lockdatei liest.
      - name: OSV-Scanner installieren (versions-gepinnt)
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
      # `--config` explizit: osv-scanner.toml würde am Lockfile-Ort auch
      # automatisch gefunden, aber explizit heißt, dass ein Tippfehler im Pfad
      # den Lauf abbricht statt die dokumentierten Ausnahmen still zu ignorieren.
      # Alle committeten Lockdateien werden gescannt — weder mcp-poc noch
      # services/entitlements sind Workspace-Member, ihre Abhängigkeiten sind
      # aber genauso im Repo und werden von jedem installiert, der sie startet.
      # Der EntitlementService (WP 6.2) wiegt dabei schwerer als der PoC: Er
      # hält Berechtigungen und spricht mit dem Zahlungsdienstleister.
      - name: pnpm-Lockfiles gegen OSV-Advisories scannen
        run: |
          $(go env GOPATH)/bin/osv-scanner scan source \
            --lockfile=pnpm-lock.yaml \
            --lockfile=mcp-poc/pnpm-lock.yaml \
            --lockfile=services/entitlements/pnpm-lock.yaml \
            --config=osv-scanner.toml
