ignoreUntil = 2026-10-31
# @hono/node-server (nur mcp-poc/pnpm-lock.yaml): Path-Traversal in
# `serve-static` über kodierte Backslashes — ausschließlich auf Windows-Hosts.
# Behoben erst in 2.0.5; @modelcontextprotocol/sdk 1.29.0 (aktuell) fordert
# `^1.19.9`, ein Override auf 2.x würde die deklarierte Range des SDK brechen.
# Ausschlaggebend: mcp-poc bindet weder hono noch `serve-static` ein (Express +
# helmet, siehe mcp-poc/src/index.ts) — der verwundbare Code wird nicht geladen.
# Zusätzlich betrifft der Fund nur Windows-Hosts.
reason = "Windows-only serve-static-Traversal; mcp-poc nutzt kein serve-static. Fix erst in 2.x, außerhalb der SDK-Range ^1.19.9."
