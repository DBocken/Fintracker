# Konfiguration für den OSV-Scanner (CI: .github/workflows/security-audit.yml).
#
# Hier stehen ausschließlich Funde, für die es **keinen kompatiblen Patch** gibt.
# Alles, was durch eine Version oder ein `pnpm.overrides`-Floor behebbar ist,
# wird behoben und nicht ignoriert (siehe docs/security-guidelines.md, Klasse 7).
# Jeder Eintrag nennt Grund und Ablaufdatum — nach `ignoreUntil` schlägt CI
# wieder an und erzwingt eine neue Bewertung.

[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2026-10-31
# react-router: CSRF-Bypass im RSC-Modus (Action-Ausführung vor 400-Antwort).
# Behoben erst in react-router 8.3.0; die 7.x-Linie bekommt keinen Patch.
# Nicht ausnutzbar in Fintracker: die App ist eine reine Client-SPA
# (`BrowserRouter` in src/App.tsx, Vite-Build, kein SSR/RSC-Handler, keine
# react-router-Actions auf einem Server). Der Ausstieg ist der Wechsel auf
# react-router 8 (Major, react-router-dom wird dort aufgelöst) — eigener
# Vorgang, kein Sicherheitspatch.
reason = "RSC-only CSRF; Fintracker ist Client-SPA ohne SSR/RSC. Fix nur in react-router 8 (Major-Migration)."

[[IgnoredVulns]]
id = "GHSA-frvp-7c67-39w9"
ignoreUntil = 2026-10-31
# @hono/node-server (nur mcp-poc/pnpm-lock.yaml): Path-Traversal in
# `serve-static` über kodierte Backslashes — ausschließlich auf Windows-Hosts.
# Behoben erst in 2.0.5; @modelcontextprotocol/sdk 1.29.0 (aktuell) fordert
# `^1.19.9`, ein Override auf 2.x würde die deklarierte Range des SDK brechen.
# Ausschlaggebend: mcp-poc bindet weder hono noch `serve-static` ein (Express +
# helmet, siehe mcp-poc/src/index.ts) — der verwundbare Code wird nicht geladen.
# Zusätzlich betrifft der Fund nur Windows-Hosts.
reason = "Windows-only serve-static-Traversal; mcp-poc nutzt kein serve-static. Fix erst in 2.x, außerhalb der SDK-Range ^1.19.9."
